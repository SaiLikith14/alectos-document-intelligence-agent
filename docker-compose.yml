services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: alectos
      POSTGRES_USER: alectos
      POSTGRES_PASSWORD: alectos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alectos -d alectos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://alectos:alectos@db:5432/alectos
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
